# Main test workflow

name: Tests

on:
  pull_request:
    branches: [ "master", "main" ]

# Cancel superseded runs when new commits are pushed to the same PR.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.139.3
  NODE_VERSION: 23.x

jobs:
  Build:
    runs-on: ${{ vars.UBUNTU_VERSION }}

    strategy:
      fail-fast: false
      matrix:
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [ latest, 23.x, 22.x, 21, 20.x ]

    steps:
      # This job only runs the lint suite (`npm test`), so Hugo and Dart Sass are not needed.
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - run: npm test

  # Validate the generated HTML markup
  HTML:
    runs-on: ${{ vars.UBUNTU_VERSION }}
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${{ env.HUGO_VERSION }}/hugo_extended_${{ env.HUGO_VERSION }}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        working-directory: ./src
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify
      - name: Validate HTML
        run: npm run test:html

  # Visual regression: expected / actual / heatmap per viewport, posted to the PR.
  # Skipped for fork PRs, whose read-only token can't push images or comment.
  Visual:
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork == false }}
    runs-on: ${{ vars.UBUNTU_VERSION }}
    permissions:
      contents: write        # push artifacts branch + commit refreshed baselines
      pull-requests: write   # post the comparison comment
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${{ env.HUGO_VERSION }}/hugo_extended_${{ env.HUGO_VERSION }}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Use a PAT if provided so baseline commits can retrigger checks;
          # falls back to GITHUB_TOKEN otherwise.
          token: ${{ secrets.VISUAL_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Determine baseline mode
        id: mode
        # Refresh baselines when the PR carries the 'update-visual-baselines' label.
        run: |
          if echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | grep -q 'update-visual-baselines'; then
            echo "update=1" >> "$GITHUB_OUTPUT"
          else
            echo "update=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Run visual regression
        id: visual
        # Capture pass/fail without aborting; we still publish images and comment.
        continue-on-error: true
        env:
          UPDATE_SNAPSHOTS: ${{ steps.mode.outputs.update }}
        run: |
          if [ "$UPDATE_SNAPSHOTS" = "1" ]; then
            npm run visual:update
          else
            npm run visual
          fi
      - name: Commit refreshed baselines
        # When baselines were (re)generated, commit them back to the PR branch.
        run: |
          if [ -n "$(git status --porcelain test/visual/baseline)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add test/visual/baseline
            git commit -m "Update visual regression baselines [skip ci]"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
      - name: Publish comparison images
        id: publish
        env:
          ARTIFACTS_BRANCH: ci-artifacts
          DEST_DIR: visual/pr-${{ github.event.pull_request.number }}/${{ github.run_id }}
          SRC_DIR: visual-output
          GH_TOKEN: ${{ secrets.VISUAL_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-images.sh >> "$GITHUB_OUTPUT"
      - name: Build PR comment
        env:
          RAW_BASE: ${{ steps.publish.outputs.RAW_BASE }}
          OUT: visual-comment.md
        run: node scripts/visual-comment.mjs
      - name: Find existing visual comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Visual Regression Report
      - name: Post or update visual regression comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: visual-comment.md
          edit-mode: replace
      - name: Fail if visual diff exceeded threshold
        if: ${{ steps.visual.outcome == 'failure' }}
        run: |
          echo "Visual regression exceeded the allowed threshold." >&2
          exit 1

  # Make a Lighthouse Report
  # Skipped for fork PRs, whose read-only token can't push images or comment.
  Lighthouse:
    needs: Build
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork == false }}
    runs-on: ${{ vars.UBUNTU_VERSION }}

    permissions:
      # Required to upload/save artifact, otherwise you'll get
      # "Error: Resource not accessible by integration"
      contents: write
      # Required to post comment, otherwise you'll get
      # "Error: Resource not accessible by integration"
      pull-requests: write
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${{ env.HUGO_VERSION }}/hugo_extended_${{ env.HUGO_VERSION }}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Run Hugo Server
        working-directory: ./src
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        # Run server in background
        run: hugo server &
      - name: Wait for Hugo server
        # Poll until the server responds instead of a fixed sleep.
        run: npx --yes wait-on http://localhost:1313/ --timeout 60000
      - name: Run Lighthouse Desktop
        run: npm run lighthouse-desktop
      - name: Run Lighthouse Mobile
        run: npm run lighthouse-mobile
      - name: Make Lighthouse Mobile Report Screenshot
        run: npm run screenshot:mobile
      - name: Make Lighthouse Desktop Report Screenshot
        run: npm run screenshot:desktop
      - name: Upload Lighthouse Report
        id: lighthouseUploadReport
        uses: actions/upload-artifact@v7
        with:
          name: Lighthouse-report
          path: |
            desktop.report.html
            desktop.report.json
            mobile.report.html
            mobile.report.json
      - name: Collect report images
        run: |
          mkdir -p lighthouse-images
          cp mobile.jpg desktop.jpg lighthouse-images/
      - name: Publish report images
        id: publish
        env:
          ARTIFACTS_BRANCH: ci-artifacts
          DEST_DIR: lighthouse/pr-${{ github.event.pull_request.number }}/${{ github.run_id }}
          SRC_DIR: lighthouse-images
          GH_TOKEN: ${{ secrets.VISUAL_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-images.sh >> "$GITHUB_OUTPUT"
      - name: Publish info
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Lighthouse Report
            |  Mobile  |  Desktop |
            |----|----|
            | ![Lighthouse Mobile Report Score](${{ steps.publish.outputs.RAW_BASE }}/mobile.jpg) | ![Lighthouse Desktop Report Score](${{ steps.publish.outputs.RAW_BASE }}/desktop.jpg) |

            [Download report ZIP](${{ steps.lighthouseUploadReport.outputs.artifact-url }})
      - name: Check Lighthouse thresholds
        # Runs last so the report artifact and PR comment are always published first;
        # this step fails the job if any category score is below its configured minimum.
        run: npm run lighthouse:check
